name: Crear keystore de firma

# Genera UNA sola vez el keystore de firma de Kairós y lo sube como artifact
# para guardarlo como secreto del repositorio (KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generar keystore
        env:
          ALIAS: kairos
        run: |
          PASS="$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 20)"
          keytool -genkeypair -v \
            -keystore kairos.keystore \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Kairos, OU=App, O=Kairos, C=MX"
          base64 -w0 kairos.keystore > kairos.keystore.b64
          {
            echo "alias=$ALIAS"
            echo "password=$PASS"
          } > keystore-info.txt
          echo "Keystore generado (alias=$ALIAS)"

      - uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: |
            kairos.keystore
            kairos.keystore.b64
            keystore-info.txt
          if-no-files-found: error
